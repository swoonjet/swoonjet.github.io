<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jon Toews — Creative Director</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Archivo+Black&family=Anton&family=Oswald:wght@700&family=Bebas+Neue&family=Poppins:wght@900&family=Abril+Fatface&family=Playfair+Display:wght@900&family=Cinzel:wght@900&family=Alfa+Slab+One&family=Titan+One&family=Bangers&family=Fredoka:wght@700&family=Passion+One:wght@900&family=Bungee&family=Rampart+One&family=Black+Ops+One&family=Special+Elite&family=Space+Mono:wght@700&family=Permanent+Marker&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --text: #f5f5f5;
            --muted: #888;
            --accent: #ff1f71;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .hero::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,31,113,0.12) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .hero {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 1.15;
        }

        /* Each hero line has a box height fixed in em (so it still scales
           with the responsive font-size) so a glitched-in font's different
           metrics can never grow/shrink this element and bump the blurb or
           buttons below it. nowrap means a wide face can't wrap a word onto
           a second line either -- that would be a much bigger bump. See the
           mobile breakpoints below for how the font-size itself is kept
           small enough that nowrap doesn't run text off small screens. */
        h1 .hero-line {
            display: block;
            height: 1.15em;
            line-height: 1.15;
            white-space: nowrap;
            overflow: visible;
        }

        h1 .hero-line--accent {
            color: #ff1f71;
        }

        .gl {
            display: inline-block;
            font-family: inherit;
            font-weight: inherit;
        }

        .gl-space {
            display: inline-block;
            width: 0.32em;
        }

        .blurb {
            font-size: 1.25rem;
            color: #bbb;
            max-width: 500px;
            font-weight: 400;
            line-height: 1.6;
        }

        .email-link {
            display: inline-block;
            padding: 0.9rem 2.5rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 100px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .email-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255,31,113,0.3);
        }

        .experiments-link {
            display: inline-block;
            margin-top: 0.25rem;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.25s ease, border-color 0.25s ease;
        }

        .experiments-link:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .experiments-link .arrow {
            display: inline-block;
            margin-left: 0.4em;
            transition: transform 0.25s ease;
        }

        .experiments-link:hover .arrow {
            transform: translateX(4px);
        }

        /* Narrower viewports: the 20-face glitch pool spans very different
           character widths (a pixel/monospace face vs. a slim condensed
           sans), and h1 is nowrap by design (see above). Shrinking the
           floor here keeps even a wide-leaning glitch combination fitting
           on a phone instead of running past the screen edge. */
        @media (max-width: 640px) {
            h1 {
                font-size: clamp(1.9rem, 9.5vw, 2.6rem);
                letter-spacing: -1.5px;
            }
        }

        @media (max-width: 380px) {
            h1 {
                font-size: clamp(1.6rem, 9.5vw, 2.2rem);
                letter-spacing: -1px;
            }
        }
    </style>
</head>
<body>

    <canvas id="ca-canvas"></canvas>

    <div class="hero">
        <h1>
            <span class="hero-line hero-line--accent"><span class="gl">J</span><span class="gl">o</span><span class="gl">n</span><span class="gl-space"> </span><span class="gl">T</span><span class="gl">o</span><span class="gl">e</span><span class="gl">w</span><span class="gl">s</span></span>
            <span class="hero-line"><span class="gl">C</span><span class="gl">r</span><span class="gl">e</span><span class="gl">a</span><span class="gl">t</span><span class="gl">i</span><span class="gl">v</span><span class="gl">e</span><span class="gl-space"> </span><span class="gl">D</span><span class="gl">i</span><span class="gl">r</span><span class="gl">e</span><span class="gl">c</span><span class="gl">t</span><span class="gl">o</span><span class="gl">r</span></span>
        </h1>
        <p class="blurb">Award-winning creative direction spanning digital experiences, brand systems, film, short fiction, music, and emerging technology.</p>
        <a href="mailto:jontoews@gmail.com" class="email-link">jontoews@gmail.com</a>
        <p class="blurb" style="color: var(--muted); font-size: 0.95rem;">I'd love to hear from you about new projects,<br>creative collaborations, or opportunities.</p>
        <a href="/experiments/" class="experiments-link">Experiments<span class="arrow">→</span></a>
    </div>

    <script>
        // ============================================================
        // A custom cellular automaton -- deliberately NOT Conway's Game of
        // Life rules. Boolean alive/dead state evolves on a fixed timer
        // (a "generation"), using wider/more permissive birth & survival
        // neighbor-count bands than B3/S23 so colonies actively spread and
        // persist rather than GoL's famously fragile die-off. Layered on
        // top of that discrete rule engine:
        //   - each cell also carries a continuous `energy` value that eases
        //     toward 1 (alive) or 0 (dead) every rendered frame, independent
        //     of how chunky the generation ticks are -- rendered as a circle
        //     whose radius AND alpha scale with energy, so birth reads as a
        //     literal grow-from-a-point and death as a shrink-to-nothing,
        //     not a hard on/off flicker.
        //   - a newborn cell inherits its color from a live neighbor (with
        //     a small mutation chance), so colonies read as genetically
        //     related blobs rather than uniform noise.
        //   - small independent random birth/death probabilities stop any
        //     pattern from ever freezing into a static still-life.
        //   - periodic reseed events drop a fresh cluster of cells at a
        //     random point on the canvas -- literal "multiplying" into new
        //     territory, not just neighbor-adjacent growth.
        // Rendered on a fully transparent-cleared canvas (no fill rect) so
        // only living cells emit any light against the page's near-black
        // background -- kept intentionally dark/sparse for text legibility.
        //
        // Tap/click anywhere launches an outward kill wave (a dotted
        // shockwave ring) that clears a big radius; normal growth rules
        // regrow it over the following seconds.
        // ============================================================
        (function () {
            "use strict";

            var canvas = document.getElementById('ca-canvas');
            var ctx = canvas.getContext('2d');
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var cssW = 0, cssH = 0;

            var PALETTE = ['#ff1f71', '#c026d3', '#7858ff', '#06b6d4', '#ffffff'];

            var TICK_MS = 130;
            var CELL = 11;
            var BRIGHTNESS = 0.15;
            var RESEED_SEC = 5;
            var BLAST_FACTOR = 0.55; // fraction of min(width,height) -- big on purpose

            // ---------------- custom rule constants ----------------
            var BIRTH_MIN = 2, BIRTH_MAX = 4;       // wider than GoL's exact-3 birth
            var SURVIVE_MIN = 1, SURVIVE_MAX = 4;   // wider than GoL's 2-3 survival
            var SPONTANEOUS_DEATH = 0.015;          // natural turnover even when "should" survive
            var SPONTANEOUS_BIRTH = 0.0006;         // rare unprovoked spark, keeps it from ever fully dying
            var COLOR_MUTATION = 0.08;
            var ENERGY_EASE = 0.14;

            var cols, rows;
            var alive, next, energy, colorIdx;

            function idx(x, y) { return y * cols + x; }

            function hexToRgba(hex, alpha) {
                var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
                return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha.toFixed(3) + ')';
            }

            function seedRandom(count, cx, cy, radius) {
                for (var i = 0; i < count; i++) {
                    var x, y;
                    if (cx != null) {
                        x = Math.max(0, Math.min(cols - 1, Math.round(cx + (Math.random() * 2 - 1) * radius)));
                        y = Math.max(0, Math.min(rows - 1, Math.round(cy + (Math.random() * 2 - 1) * radius)));
                    } else {
                        x = Math.floor(Math.random() * cols);
                        y = Math.floor(Math.random() * rows);
                    }
                    var id = idx(x, y);
                    alive[id] = 1;
                    colorIdx[id] = Math.floor(Math.random() * PALETTE.length);
                }
            }

            function buildGrid() {
                cols = Math.ceil(cssW / CELL);
                rows = Math.ceil(cssH / CELL);
                var n = Math.max(1, cols * rows);
                alive = new Uint8Array(n);
                next = new Uint8Array(n);
                energy = new Float32Array(n);
                colorIdx = new Uint8Array(n);
                seedRandom(Math.floor(n * 0.02));
            }

            function resize() {
                cssW = window.innerWidth;
                cssH = window.innerHeight;
                canvas.width = cssW * dpr;
                canvas.height = cssH * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                buildGrid();
            }

            function neighborCount(x, y) {
                var count = 0;
                for (var dy = -1; dy <= 1; dy++) {
                    var ny = (y + dy + rows) % rows;
                    var rowBase = ny * cols;
                    for (var dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        var nx = (x + dx + cols) % cols;
                        count += alive[rowBase + nx];
                    }
                }
                return count;
            }

            function pickParentColor(x, y) {
                if (Math.random() < COLOR_MUTATION) return Math.floor(Math.random() * PALETTE.length);
                var candidates = [];
                for (var dy = -1; dy <= 1; dy++) {
                    var ny = (y + dy + rows) % rows;
                    var rowBase = ny * cols;
                    for (var dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        var nx = (x + dx + cols) % cols;
                        var id = rowBase + nx;
                        if (alive[id]) candidates.push(colorIdx[id]);
                    }
                }
                if (!candidates.length) return Math.floor(Math.random() * PALETTE.length);
                return candidates[Math.floor(Math.random() * candidates.length)];
            }

            function step() {
                for (var y = 0; y < rows; y++) {
                    for (var x = 0; x < cols; x++) {
                        var id = idx(x, y);
                        var n = neighborCount(x, y);
                        var willLive;
                        if (alive[id]) {
                            willLive = (n >= SURVIVE_MIN && n <= SURVIVE_MAX) && Math.random() > SPONTANEOUS_DEATH;
                        } else {
                            willLive = (n >= BIRTH_MIN && n <= BIRTH_MAX) || Math.random() < SPONTANEOUS_BIRTH;
                            if (willLive) colorIdx[id] = pickParentColor(x, y);
                        }
                        next[id] = willLive ? 1 : 0;
                    }
                }
                var tmp = alive; alive = next; next = tmp;
            }

            function render() {
                ctx.clearRect(0, 0, cssW, cssH);
                var n = cols * rows;
                for (var i = 0; i < n; i++) {
                    var target = alive[i] ? 1 : 0;
                    var e = energy[i] + (target - energy[i]) * ENERGY_EASE;
                    energy[i] = e;
                    if (e < 0.004) { energy[i] = 0; continue; }

                    var x = i % cols, y = (i / cols) | 0;
                    var cx = x * CELL + CELL / 2, cy = y * CELL + CELL / 2;
                    var radius = (CELL * 0.5) * Math.min(1, e);
                    var alpha = BRIGHTNESS * e;

                    ctx.fillStyle = hexToRgba(PALETTE[colorIdx[i]], alpha);
                    ctx.beginPath();
                    ctx.arc(cx, cy, Math.max(0, radius), 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---------------- click/tap-to-explode ----------------
            var explosions = [];
            var EXPLOSION_DURATION = 550;

            function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

            function triggerExplosion(x, y) {
                explosions.push({ x: x, y: y, startTime: null, maxRadius: BLAST_FACTOR * Math.min(cssW, cssH) });
            }

            function updateExplosions(ts) {
                for (var i = explosions.length - 1; i >= 0; i--) {
                    var ex = explosions[i];
                    if (ex.startTime === null) ex.startTime = ts;
                    var t = (ts - ex.startTime) / EXPLOSION_DURATION;
                    if (t >= 1) { explosions.splice(i, 1); continue; }

                    var waveRadius = ex.maxRadius * easeOutCubic(t);
                    var waveRadiusSq = waveRadius * waveRadius;
                    var gx0 = Math.max(0, Math.floor((ex.x - waveRadius) / CELL));
                    var gx1 = Math.min(cols - 1, Math.ceil((ex.x + waveRadius) / CELL));
                    var gy0 = Math.max(0, Math.floor((ex.y - waveRadius) / CELL));
                    var gy1 = Math.min(rows - 1, Math.ceil((ex.y + waveRadius) / CELL));

                    for (var gy = gy0; gy <= gy1; gy++) {
                        var cy = gy * CELL + CELL / 2;
                        var dy = cy - ex.y;
                        var rowBase = gy * cols;
                        for (var gx = gx0; gx <= gx1; gx++) {
                            var cx = gx * CELL + CELL / 2;
                            var dx = cx - ex.x;
                            if (dx * dx + dy * dy <= waveRadiusSq) alive[rowBase + gx] = 0;
                        }
                    }
                }
            }

            function renderExplosions(ts) {
                for (var i = 0; i < explosions.length; i++) {
                    var ex = explosions[i];
                    if (ex.startTime === null) continue;
                    var t = (ts - ex.startTime) / EXPLOSION_DURATION;
                    if (t < 0 || t > 1) continue;
                    var r = ex.maxRadius * easeOutCubic(t);
                    var alpha = (1 - t) * 0.22;
                    ctx.strokeStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 8]);
                    ctx.beginPath();
                    ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // touchstart fires immediately on tap (no ~300ms synthesized-click
            // delay); the click listener below guards against double-firing
            // for the same tap once the browser's own click event follows.
            var lastTouchTriggerTime = 0;
            window.addEventListener('touchstart', function (e) {
                if (!e.touches || !e.touches.length) return;
                var t = e.touches[0];
                lastTouchTriggerTime = performance.now();
                triggerExplosion(t.clientX, t.clientY);
            }, { passive: true });

            window.addEventListener('click', function (e) {
                if (performance.now() - lastTouchTriggerTime < 600) return;
                triggerExplosion(e.clientX, e.clientY);
            });

            var lastTick = 0, lastReseed = 0, started = false;

            function frame(ts) {
                if (!started) { lastTick = ts; lastReseed = ts; started = true; }

                if (ts - lastTick >= TICK_MS) {
                    step();
                    lastTick = ts;
                }
                if (ts - lastReseed >= RESEED_SEC * 1000) {
                    seedRandom(6 + Math.floor(Math.random() * 10), Math.random() * cols, Math.random() * rows, 4);
                    lastReseed = ts;
                }

                updateExplosions(ts);
                render();
                renderExplosions(ts);
                requestAnimationFrame(frame);
            }

            resize();
            window.addEventListener('resize', resize);
            requestAnimationFrame(frame);
        })();
    </script>

    <script>
        // ============================================================
        // Per-letter type glitch: every letter starts in the page's base
        // font (Inter) and, on its own independent random clock, flickers
        // through a couple of the 20 curated display faces below before
        // landing on one -- or occasionally landing back on Inter -- and
        // holding there for a while before glitching again. Unsynchronized
        // per letter, forever, so the word is always some evolving mix of
        // faces rather than a single synchronized effect.
        // ============================================================
        (function () {
            "use strict";

            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            // 20 curated faces, bold-to-heavy where the family offers it,
            // deliberately spanning as many distinct type genres as possible:
            // grotesque, condensed display, geometric, high-contrast serif,
            // classical serif, slab, comic/cartoon, rounded, urban/graffiti,
            // stencil, typewriter, monospace, marker script, pixel.
            var FONTS = [
                { family: "'Archivo Black', sans-serif", weight: 400 },
                { family: "'Anton', sans-serif", weight: 400 },
                { family: "'Oswald', sans-serif", weight: 700 },
                { family: "'Bebas Neue', sans-serif", weight: 400 },
                { family: "'Poppins', sans-serif", weight: 900 },
                { family: "'Abril Fatface', serif", weight: 400 },
                { family: "'Playfair Display', serif", weight: 900 },
                { family: "'Cinzel', serif", weight: 900 },
                { family: "'Alfa Slab One', serif", weight: 400 },
                { family: "'Titan One', cursive", weight: 400 },
                { family: "'Bangers', cursive", weight: 400 },
                { family: "'Fredoka', sans-serif", weight: 700 },
                { family: "'Passion One', cursive", weight: 900 },
                { family: "'Bungee', cursive", weight: 400 },
                { family: "'Rampart One', cursive", weight: 400 },
                { family: "'Black Ops One', cursive", weight: 400 },
                { family: "'Special Elite', cursive", weight: 400 },
                { family: "'Space Mono', monospace", weight: 700 },
                { family: "'Permanent Marker', cursive", weight: 400 },
                { family: "'Press Start 2P', cursive", weight: 400 }
            ];

            function randInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }
            function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

            function applyBase(span) {
                span.style.fontFamily = '';
                span.style.fontWeight = '';
            }
            function applyFont(span, f) {
                span.style.fontFamily = f.family;
                span.style.fontWeight = f.weight;
            }

            // Landing pool is weighted so a letter returns to base Inter
            // roughly one time in six, giving the word periodic moments
            // of full legibility instead of drifting purely chaotic.
            function landingChoice() {
                return Math.random() < 0.16 ? null : pick(FONTS);
            }

            function flickerThenLand(span, onLand) {
                var steps = randInt(2, 4);
                var i = 0;
                (function step() {
                    if (i >= steps) { onLand(); return; }
                    applyFont(span, pick(FONTS));
                    i++;
                    setTimeout(step, randInt(60, 150));
                })();
            }

            function loop(span) {
                var dwell = randInt(2000, 7000);
                setTimeout(function () {
                    flickerThenLand(span, function () {
                        var landed = landingChoice();
                        if (landed) applyFont(span, landed); else applyBase(span);
                        loop(span);
                    });
                }, dwell);
            }

            var letters = document.querySelectorAll('.gl');
            for (var i = 0; i < letters.length; i++) {
                (function (span) {
                    setTimeout(function () { loop(span); }, randInt(400, 4000));
                })(letters[i]);
            }
        })();
    </script>

</body>
</html>
