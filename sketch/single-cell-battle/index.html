<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single Cell Battle — sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel2: #1a1a1a;
    --border: #262626;
    --text: #f5f5f5;
    --muted: #8a8a8a;
    --accent: #ff1f71;
    --p1: #4d8dff;
    --p2: #ff1f71;
    --special: #c026d3;
    --danger: #ff4d4d;
    --good: #4ade80;
    --bad: #f87171;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
  }
  html, body { background:var(--bg); color:var(--text); }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 20px 16px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { width: 100%; max-width: 900px; }
  @media (min-width: 1000px) {
    .wrap { max-width: 1180px; }
  }
  header { text-align:center; margin-bottom: 24px; }
  header .tag {
    display:inline-block; font-size: 11px; letter-spacing: .06em; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; margin-bottom: 14px;
  }
  h1 {
    font-family: 'Press Start 2P', 'Inter', monospace; font-size: clamp(30px, 9vw, 58px);
    font-weight: 400; letter-spacing: 0; line-height: 1.5;
    display: inline-block; will-change: transform;
  }
  h1 span { color: var(--accent); }
  h1.glitching { text-shadow: 2px 0 var(--p2), -2px 0 var(--p1); }
  header p { color: var(--muted); font-size: 14px; margin-top: 14px; max-width: 480px; margin-inline: auto; line-height:1.5; }
  header a { color: var(--muted); text-decoration: underline; }

  .arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .arena { grid-template-columns: 1fr; }
    .vs { order: 2; width: 100%; }
    .card.p2 { order: 3; }
  }

  .battle-layout { display:flex; flex-direction:column; gap:16px; }
  .arena-wrap { position: relative; }
  .side-log { display:flex; flex-direction:column; }
  @media (min-width: 1000px) {
    .battle-layout { display:grid; grid-template-columns: 1fr 360px; gap:20px; align-items:start; }
    .side-log .banner { margin-top:0; margin-bottom:12px; }
    .side-log .log-panel { flex:1; min-height:0; max-height:74vh; margin-top:0; }
  }

  .win-overlay {
    position:absolute; inset:0; background:rgba(0,0,0,.88); border-radius:16px;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    z-index:200; pointer-events:none; cursor:pointer;
    padding:20px; text-align:center;
  }
  .win-overlay.show { display:flex; pointer-events:auto; }
  .win-line {
    font-family: 'Press Start 2P', 'Inter', monospace; line-height:1.4;
    text-shadow: 3px 3px 0 rgba(0,0,0,.6); word-break: break-word;
  }
  .win-line.win { font-size: clamp(18px, 5.5vw, 34px); }
  .win-line.lose { font-size: clamp(12px, 3.5vw, 20px); color: var(--danger); opacity:.85; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    min-width: 0;
    transition: border-color .15s ease;
  }
  .card.p1 { border: 1px solid var(--p1); }
  .card.p2 { border: 1px solid var(--p2); }

  @keyframes hitShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }
  @keyframes missFlicker {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
  }
  @keyframes specialGlow {
    0%, 100% { box-shadow: 0 0 0 0 transparent; }
    50% { box-shadow: 0 0 22px 2px var(--special); }
  }
  .card.hit-flash { animation: hitShake .32s ease; border-color: var(--danger) !important; }
  .card.miss-flash { animation: missFlicker .32s ease; }
  .card.special-flash { animation: specialGlow .42s ease; border-color: var(--special) !important; }

  .cell-name { font-size: 20px; font-weight: 700; word-break: break-word; }
  .card.p1 .cell-name { color: var(--p1); }
  .card.p2 .cell-name { color: var(--p2); }
  .cell-sub { font-size: 13px; color: var(--muted); margin-top: 2px; margin-bottom: 10px; }

  .sprite {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 8.5px; line-height: 1.15; white-space: pre; overflow-x: auto;
    -webkit-overflow-scrolling: touch; margin: 4px 0 12px; text-align: left;
    display: block;
  }
  .card.p1 .sprite { color: var(--p1); }
  .card.p2 .sprite { color: var(--p2); }
  @media (min-width: 721px) {
    .sprite { font-size: 10px; }
  }
  @keyframes lungeRight { 0%,100% { transform: translateX(0); } 40% { transform: translateX(10px) scale(1.03); } }
  @keyframes lungeLeft { 0%,100% { transform: translateX(0); } 40% { transform: translateX(-10px) scale(1.03); } }
  @keyframes spriteFlinch { 0% { filter: none; transform: scale(1); } 30% { filter: invert(1); transform: scale(.94); } 100% { filter: none; transform: scale(1); } }
  .sprite.lunge-p1 { animation: lungeRight .28s ease; }
  .sprite.lunge-p2 { animation: lungeLeft .28s ease; }
  .sprite.flinch { animation: spriteFlinch .28s ease; }

  .bar-row { display:flex; align-items:center; gap:8px; margin-bottom: 8px; font-size: 11px; color: var(--muted); }
  .bar-row > span:first-child { width: 22px; flex-shrink:0; font-weight:700; }
  .bar { flex:1; height: 10px; background:#000; border-radius:999px; overflow:hidden; border:1px solid var(--border); }
  .bar-fill { height:100%; border-radius:999px; transition: width .25s ease; }
  .bar-fill.hp { background: linear-gradient(90deg, var(--good), #86efac); }
  .bar-fill.en { background: linear-gradient(90deg, #60a5fa, #93c5fd); }
  .bar-num { flex-shrink:0; width:64px; text-align:right; font-variant-numeric: tabular-nums; }

  .stat-grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin: 14px 0; }
  .stat-grid div { background: var(--panel2); border-radius:10px; padding:6px 2px; text-align:center; }
  .stat-grid b { display:block; font-size:15px; }
  .stat-grid small { font-size:10px; color:var(--muted); letter-spacing:.03em; }

  .traits { border-top: 1px solid var(--border); padding-top: 10px; }
  .trait-row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:12.5px; }
  .trait-label { color: var(--muted); flex-shrink:0; }
  .trait-value { text-align:right; }

  [data-tooltip] { position: relative; cursor: default; }
  [data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%) translateY(-6px);
    width: max-content; max-width: 200px;
    background: #000; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 11px; font-weight: 400; color: var(--text); line-height: 1.4;
    text-align: left; white-space: normal;
    opacity: 0; visibility: hidden; transition: opacity .15s ease;
    pointer-events: none; z-index: 30;
  }
  .stat-grid [data-tooltip]::after { text-align: center; }
  [data-tooltip]:hover::after { opacity: 1; visibility: visible; }
  @media (hover: none) { [data-tooltip]::after { display: none; } }

  .vs {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding: 6px 4px; align-self: center;
  }
  .stage {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; font-weight:700; color: var(--muted); letter-spacing:.05em;
    white-space: nowrap; min-height: 18px; transition: color .1s ease;
  }

  button {
    font-family: inherit; font-size: 15px; font-weight: 700; cursor:pointer;
    border-radius: 12px; border: none; padding: 13px 18px; min-height: 48px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-battle { background: var(--accent); color:#fff; width: 100%; }
  .btn-battle:disabled { opacity:.4; cursor:default; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); width:100%; }
  .btn-ghost:active, .btn-battle:active { transform: scale(.98); }

  .log-panel {
    margin-top: 22px; background: #000; border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; max-height: 42vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.6; display:none;
  }
  .log-panel.show { display:block; }
  .log-line { white-space: pre-wrap; word-break: break-word; color: var(--text); opacity:.92; }
  .log-line.turn { color: var(--muted); margin-top:8px; font-weight:700; }
  .log-line.effect { color: #38bdf8; }
  .log-line.victory, .log-line.draw { color: var(--accent); font-weight:800; margin-top:10px; }
  .log-line.header { color: var(--muted); }

  .banner {
    display:none; text-align:center; margin-top:16px; padding: 14px; border-radius:14px;
    background: var(--panel); border:1px solid var(--border); font-weight:800; font-size:16px;
  }
  .banner.show { display:block; }

  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .actions > * { flex:1; min-width: 140px; }

  .skip-hint { text-align:center; font-size:11px; color:var(--muted); margin-top:8px; }

  .tabs { display:flex; gap:8px; justify-content:center; margin-bottom:22px; flex-wrap:wrap; }
  .tab-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: 13px; font-weight:700; padding: 10px 16px; border-radius: 999px; min-height:auto;
  }
  .tab-btn.active { color: var(--text); border-color: var(--text); }
  .tab-section { display:none; }
  .tab-section.active { display:block; }

  .muted-small { color: var(--muted); font-size: 13px; font-weight:400; }
  .cells-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .cells-title { font-size:18px; font-weight:800; }
  .btn-small { width:auto; padding:9px 14px; min-height:auto; font-size:13px; }

  .roster-list { display:flex; flex-direction:column; gap:10px; }
  .roster-row {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .roster-rank { font-size:12px; color:var(--muted); width:22px; flex-shrink:0; font-weight:700; }
  .roster-main { flex:1; min-width:140px; }
  .roster-name { font-weight:700; font-size:15px; }
  .roster-sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .roster-stats { display:flex; gap:14px; font-size:12px; color:var(--muted); flex-shrink:0; }
  .roster-stats b { color: var(--text); }
  .roster-empty { color: var(--muted); font-size: 14px; text-align:center; padding: 30px 0; }
  .btn-release {
    background:transparent; border:1px solid var(--border); color:var(--muted);
    font-size:12px; padding:8px 12px; min-height:auto; width:auto; flex-shrink:0;
  }
  .btn-release.confirming { color: var(--danger); border-color: var(--danger); }

  .pick-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin-bottom:18px; }
  .pick-card {
    background: var(--panel); border: 2px solid var(--border); border-radius: 12px;
    padding: 12px; cursor:pointer; text-align:left;
  }
  .pick-card.selected { border-color: var(--accent); background: var(--panel2); }
  .pick-card.disabled { opacity:.35; pointer-events:none; }
  .pick-card-name { font-weight:700; font-size:14px; }
  .pick-card-sub { color:var(--muted); font-size:11px; margin-top:2px; }
  .pick-card-score { color:var(--muted); font-size:11px; margin-top:6px; }

  .team-counter { text-align:center; color: var(--muted); font-size:13px; margin-bottom:16px; }
  .team-counter b { color: var(--text); }

  .match-banner {
    text-align:center; padding: 14px; margin-bottom: 16px; border-radius:14px;
    background: var(--panel); border:1px solid var(--border); font-weight:700; font-size:14px;
  }

  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center;
    justify-content:center; z-index:1000; padding:16px;
  }
  .modal-box {
    background: var(--panel); border: 1px solid var(--border); border-radius:16px;
    padding: 22px; max-width: 420px; width:100%; text-align:center;
  }
  .modal-title { font-size:17px; font-weight:800; margin-bottom:6px; }
  .modal-sub { color: var(--muted); font-size:13px; margin-bottom:16px; }
  .upgrade-grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .upgrade-btn {
    background: var(--panel2); border:1px solid var(--border); border-radius:10px;
    padding: 12px 8px; font-size:13px; text-align:left; min-height:auto;
  }
  .upgrade-btn:active { border-color: var(--accent); }
  .upgrade-btn b { display:block; font-size:14px; }
  .upgrade-btn small { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">sketch / test page</div>
    <h1>Single Cell <span>Battle</span></h1>
    <p>A turn-based microorganism battler, ported line-for-line from a Python simulation
      (12 randomized trait categories, full combat resolution, retro ASCII sprites) into a client-side JS sketch.
      <a href="../../">jontoews.com</a></p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="quick">Quick Battle</button>
    <button class="tab-btn" data-tab="cells">My Cells</button>
    <button class="tab-btn" data-tab="team">Team Battle</button>
  </nav>

  <section id="tab-quick" class="tab-section active">
    <div class="battle-layout">
      <div class="arena-wrap">
        <div class="arena">
          <div class="card p1" id="card1"></div>
          <div class="vs">
            <div class="stage" id="stage">VS</div>
            <button class="btn-battle" id="battleBtn">Battle</button>
            <button class="btn-ghost" id="newBtn">New Cells</button>
          </div>
          <div class="card p2" id="card2"></div>
        </div>
        <div class="win-overlay" id="winOverlay">
          <div class="win-line win" id="winLine1"></div>
          <div class="win-line lose" id="winLine2"></div>
        </div>
      </div>

      <div class="side-log">
        <div class="banner" id="banner"></div>
        <div class="log-panel" id="log"></div>
        <div class="skip-hint" id="skipHint">tap the log to skip ahead</div>
      </div>
    </div>
  </section>

  <section id="tab-cells" class="tab-section">
    <div class="cells-head">
      <div class="cells-title">My Cells <span class="muted-small" id="cellsCount"></span></div>
      <button class="btn-ghost btn-small" id="rollNewCellBtn">+ New Cell</button>
    </div>
    <div id="rosterList" class="roster-list"></div>
  </section>

  <section id="tab-team" class="tab-section">
    <div id="teamStage"></div>
  </section>
</div>

<script>
'use strict';

/* ============ RNG helpers (mirror Python's random module usage) ============ */
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ============ Trait pools — ported verbatim from organism.py ============ */
const SIZES = [
  {name:'microscopic', health_mod:0.65, speed_mod:1.35, hit_chance_mod:0.8, desc:'tiny and fast, hard to hit but fragile'},
  {name:'tiny', health_mod:0.8, speed_mod:1.2, hit_chance_mod:0.9, desc:'small and quick'},
  {name:'small', health_mod:1.0, speed_mod:1.1, hit_chance_mod:1.0, desc:'balanced size'},
  {name:'medium', health_mod:1.15, speed_mod:1.0, hit_chance_mod:1.0, desc:'standard cellular size'},
  {name:'large', health_mod:1.3, speed_mod:0.85, hit_chance_mod:1.05, desc:'bulky and tough'},
  {name:'massive', health_mod:1.5, speed_mod:0.7, hit_chance_mod:1.1, desc:'huge and powerful but slow'},
];
const MOVEMENT_TYPES = [
  {name:'flagella', speed:7, evasion:15, desc:'whip-like tail for fast directional movement'},
  {name:'cilia', speed:5, evasion:20, desc:'hair-like structures for precise maneuvering'},
  {name:'pseudopodia', speed:3, evasion:14, desc:'shape-shifting extensions for slow but flexible movement'},
  {name:'jet propulsion', speed:10, evasion:6, desc:'expels fluid for burst speed'},
  {name:'phase drift', speed:5, evasion:22, desc:'shifts between dimensions for unpredictable movement'},
  {name:'magnetic glide', speed:7, evasion:18, desc:'rides magnetic field lines'},
  {name:'amoeboid', speed:4, evasion:16, desc:'flows like liquid, adaptable movement'},
  {name:'rolling', speed:8, evasion:10, desc:'spherical rolling motion, fast but predictable'},
  {name:'tentacle crawl', speed:5, evasion:18, desc:'multiple appendages for versatile movement'},
];
const ARMOR_TYPES = [
  {name:'soft membrane', defense:4, regen:5, desc:'flexible but vulnerable, heals quickly'},
  {name:'chitinous shell', defense:16, regen:0, desc:'hard insect-like coating'},
  {name:'crystalline matrix', defense:22, regen:0, desc:'rigid crystal structure, tough'},
  {name:'silica plating', defense:18, regen:1, desc:'glass-like protective layer'},
  {name:'regenerative gel', defense:6, regen:5, desc:'soft but rapidly healing'},
  {name:'void-touched skin', defense:12, regen:2, desc:'partially phases out damage'},
  {name:'reflective scales', defense:14, regen:1, desc:'bounces energy attacks'},
  {name:'biofilm layer', defense:10, regen:3, desc:'sticky protective coating'},
  {name:'calcium carbonate', defense:18, regen:1, desc:'shell-like mineral armor'},
  {name:'elastic membrane', defense:8, regen:3, desc:'absorbs impact, stretchy'},
];
const ENERGY_SOURCES = [
  {name:'photosynthesis', energy_regen:5, passive:'light_heal', passive_desc:'heals 3 HP per turn in light'},
  {name:'chemosynthesis', energy_regen:4, passive:'toxin_immune', passive_desc:'immune to poison damage'},
  {name:'radiation absorption', energy_regen:5, passive:'radiation_boost', passive_desc:'+5 damage vs energy attacks'},
  {name:'thermal conversion', energy_regen:4, passive:'heat_shield', passive_desc:'15% damage reduction'},
  {name:'plasma feeding', energy_regen:6, passive:'attack_drain', passive_desc:'restores 2 energy when hit'},
  {name:'void siphon', energy_regen:5, passive:'void_touch', passive_desc:'10% chance to ignore defense'},
  {name:'osmotrophy', energy_regen:4, passive:'nutrient_absorb', passive_desc:'heals 2 HP when dealing damage'},
  {name:'predation', energy_regen:3, passive:'feast', passive_desc:'+20% damage vs low HP enemies'},
  {name:'symbiosis', energy_regen:6, passive:'shared_life', passive_desc:'starts with +15 HP'},
];
const ATTACK_TYPES = [
  {name:'toxin spray', damage:11, accuracy:82, energy_cost:8, effect:'poison', category:'chemical', desc:'releases harmful chemicals'},
  {name:'absorption tendril', damage:10, accuracy:85, energy_cost:7, effect:'drain', category:'physical', desc:'latches on and drains life'},
  {name:'harmonic pulse', damage:13, accuracy:82, energy_cost:10, effect:'stun', category:'energy', desc:'sonic wave disrupts enemy'},
  {name:'spike volley', damage:15, accuracy:78, energy_cost:9, effect:null, category:'physical', desc:'launches hardened projectiles'},
  {name:'acid burst', damage:14, accuracy:68, energy_cost:11, effect:'corrode', category:'chemical', desc:'explosive corrosive attack'},
  {name:'quantum lash', damage:15, accuracy:75, energy_cost:11, effect:'phase', category:'energy', desc:'strikes from multiple dimensions'},
  {name:'plasma bolt', damage:22, accuracy:60, energy_cost:14, effect:'burn', category:'energy', desc:'concentrated energy blast'},
  {name:'void touch', damage:20, accuracy:62, energy_cost:15, effect:'disintegrate', category:'energy', desc:'erases matter on contact'},
  {name:'enzyme injection', damage:9, accuracy:88, energy_cost:6, effect:'dissolve', category:'chemical', desc:'injects digestive enzymes'},
  {name:'membrane pierce', damage:14, accuracy:70, energy_cost:10, effect:'bleed', category:'physical', desc:'punctures cellular wall'},
  {name:'static shock', damage:13, accuracy:80, energy_cost:8, effect:'paralyze', category:'energy', desc:'electrical discharge'},
  {name:'crushing grip', damage:14, accuracy:80, energy_cost:9, effect:'slow', category:'physical', desc:'constricts and crushes'},
];
const SENSING_TYPES = [
  {name:'chemoreceptors', accuracy:10, evasion:8, desc:'detects chemical signatures'},
  {name:'photoreceptors', accuracy:15, evasion:10, desc:'light-sensitive vision'},
  {name:'magnetoreception', accuracy:12, evasion:12, desc:'feels magnetic fields'},
  {name:'echolocation', accuracy:18, evasion:8, desc:'sonic mapping'},
  {name:'quantum entanglement', accuracy:20, evasion:15, desc:'perceives across dimensions'},
  {name:'probability sense', accuracy:15, evasion:18, desc:'predicts likely futures'},
  {name:'thermoreception', accuracy:12, evasion:10, desc:'senses heat signatures'},
  {name:'pressure sense', accuracy:14, evasion:14, desc:'detects movement through pressure'},
  {name:'bioelectric field', accuracy:16, evasion:12, desc:'senses electrical fields'},
];
const SPECIAL_ABILITIES = [
  {name:'bioluminescence', effect:'blind', chance:20, desc:'flash blinds opponent'},
  {name:'rapid fission', effect:'clone', chance:18, desc:'splits into temporary copy'},
  {name:'spore cloud', effect:'confuse', chance:20, desc:'releases disorienting spores'},

/* ============ Organism — ported from organism.py, incl. evolution/scoring for the roster meta-game ============ */
const UPGRADE_BONUSES = { health:8, speed:1, defense:2, evasion:3, accuracy:3, damage:2, energy:5, regen:1 };

class Organism {
  constructor() {
    this.id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    this.name = generateName();
    this.size = choice(SIZES);
    this.movementType = choice(MOVEMENT_TYPES);
    this.armorType = choice(ARMOR_TYPES);
    this.energySource = choice(ENERGY_SOURCES);
    this.attackType = choice(ATTACK_TYPES);
    this.sensingType = choice(SENSING_TYPES);
    this.specialAbility = choice(SPECIAL_ABILITIES);
    this.toxicity = choice(TOXICITY_LEVELS);
    this.reproduction = choice(REPRODUCTION_TYPES);
    this.environment = choice(ENVIRONMENT_ADAPTATIONS);
    this.defenseMechanism = choice(DEFENSIVE_MECHANISMS);
    this.secondaryAttack = choice(SECONDARY_ATTACKS);
    this.baseHealth = 100;
    this.baseEnergy = 50;
    this.baseSpeed = 5;
    this.generation = 1;
    this.wins = 0;
    this.losses = 0;
    this.battlesFought = 0;
    this.upgrades = { health:0, speed:0, defense:0, evasion:0, accuracy:0, damage:0, energy:0, regen:0 };
    this._calculateStats();
    this.statusEffects = [];
    this.isStunned = false;
    this.shieldActive = false;
    this.reproductionTriggered = false;
    this.stealthTurns = 0;
    this.specialDisabledTurns = 0;
    this.cloneActive = false;
  }

  _calculateStats() {
    let baseHp = Math.trunc(this.baseHealth * this.size.health_mod);
    const baseEnergyVal = this.baseEnergy + this.energySource.energy_regen * 5;
    const baseSpeed = Math.trunc((this.baseSpeed + this.movementType.speed) * this.size.speed_mod);
    const baseDefense = this.armorType.defense;
    const baseAccuracy = 70 + this.sensingType.accuracy;
    let baseEvasion = this.movementType.evasion + this.sensingType.evasion;
    const baseRegen = this.armorType.regen;

    if (this.energySource.passive === 'shared_life') baseHp += 15;
    if (this.defenseMechanism.effect === 'slippery') baseEvasion += this.defenseMechanism.value || 0;

    const u = this.upgrades;
    this.maxHealth = baseHp + u.health * UPGRADE_BONUSES.health;
    this.health = this.maxHealth;
    this.maxEnergy = baseEnergyVal + u.energy * UPGRADE_BONUSES.energy;
    this.energy = this.maxEnergy;
    this.speed = baseSpeed + u.speed * UPGRADE_BONUSES.speed;
    this.defense = baseDefense + u.defense * UPGRADE_BONUSES.defense;
    this.accuracy = baseAccuracy + u.accuracy * UPGRADE_BONUSES.accuracy;
    this.evasion = baseEvasion + u.evasion * UPGRADE_BONUSES.evasion;
    this.regen = baseRegen + u.regen * UPGRADE_BONUSES.regen;
    this.damageBonus = u.damage * UPGRADE_BONUSES.damage;
  }

  evolveStat(stat) {
    if (!(stat in this.upgrades)) return false;
    this.upgrades[stat] += 1;
    this._calculateStats();
    return true;
  }

  recordBattle(won) {
    this.battlesFought += 1;
    if (won) this.wins += 1; else this.losses += 1;
  }

  getEvoLevel() {
    return Object.values(this.upgrades).reduce((a, b) => a + b, 0);
  }

  getScore() {
    return this.wins * 10 + this.getEvoLevel() * 5 + this.generation * 2;
  }

  toDict() {
    return {
      id: this.id, name: this.name, generation: this.generation,
      wins: this.wins, losses: this.losses, battlesFought: this.battlesFought,
      upgrades: this.upgrades,
      traits: {
        size: this.size.name, movementType: this.movementType.name, armorType: this.armorType.name,
        energySource: this.energySource.name, attackType: this.attackType.name, sensingType: this.sensingType.name,
        specialAbility: this.specialAbility.name, toxicity: this.toxicity.name, reproduction: this.reproduction.name,
        environment: this.environment.name, defenseMechanism: this.defenseMechanism.name, secondaryAttack: this.secondaryAttack.name,
      },
    };
  }

  static fromDict(data) {
    const find = (pool, name) => pool.find(t => t.name === name) || pool[0];
    const org = new Organism();
    const t = data.traits || {};
    org.id = data.id || org.id;
    org.name = data.name || org.name;
    org.generation = data.generation || 1;
    org.wins = data.wins || 0;
    org.losses = data.losses || 0;
    org.battlesFought = data.battlesFought || 0;
    org.upgrades = Object.assign({ health:0, speed:0, defense:0, evasion:0, accuracy:0, damage:0, energy:0, regen:0 }, data.upgrades || {});
    org.size = find(SIZES, t.size);
    org.movementType = find(MOVEMENT_TYPES, t.movementType);
    org.armorType = find(ARMOR_TYPES, t.armorType);
    org.energySource = find(ENERGY_SOURCES, t.energySource);
    org.attackType = find(ATTACK_TYPES, t.attackType);
    org.sensingType = find(SENSING_TYPES, t.sensingType);
    org.specialAbility = find(SPECIAL_ABILITIES, t.specialAbility);
    org.toxicity = find(TOXICITY_LEVELS, t.toxicity);
    org.reproduction = find(REPRODUCTION_TYPES, t.reproduction);
    org.environment = find(ENVIRONMENT_ADAPTATIONS, t.environment);
    org.defenseMechanism = find(DEFENSIVE_MECHANISMS, t.defenseMechanism);
    org.secondaryAttack = find(SECONDARY_ATTACKS, t.secondaryAttack);
    org._calculateStats();
    return org;
  }

  resetForBattle() {
    this.health = this.maxHealth;
    this.energy = this.maxEnergy;
    this.statusEffects = [];
    this.isStunned = false;
    this.shieldActive = false;
    this.reproductionTriggered = false;
    this.cloneActive = false;
    this.specialDisabledTurns = 0;
    this.stealthTurns = this.defenseMechanism.effect === 'stealth' ? (this.defenseMechanism.value || 2) : 0;
  }

  isAlive() { return this.health > 0; }
  getEffectiveEvasion() { return this.evasion + (this.stealthTurns > 0 ? 50 : 0); }
  canUseSpecial() { return this.specialDisabledTurns <= 0; }
}

function padCenter(s, width) {
  if (s.length >= width) return s.slice(0, width);
  const leftPad = Math.floor((width - s.length) / 2);
  const rightPad = width - s.length - leftPad;
  return ' '.repeat(leftPad) + s + ' '.repeat(rightPad);
}

function generateOrganismSprite(organism, frame) {
  frame = frame || 0;
  const armor = organism.armorType.name;

  const movement = organism.movementType.name;

  const body = BODY_SHAPES[armor] || BODY_SHAPES['soft membrane'];
  const inner = INNER_PATTERNS[energy] || INNER_PATTERNS['photosynthesis'];
  const moveDeco = MOVEMENT_DECORATIONS[movement] || MOVEMENT_DECORATIONS['flagella'];

  const sprite = [];
  if (moveDeco.top) sprite.push(padCenter(moveDeco.top, SPRITE_WIDTH_FINAL));

  const rot = (arr, i) => arr[(i + frame) % arr.length];
  const innerRows = inner.map((_, i) => padCenter(rot(inner, i), INNER_WIDTH));

  const innerRowIndices = [];
  body.forEach((line, idx) => { if (line.includes('{INNER_')) innerRowIndices.push(idx); });

  let decoIdx = 0;
  body.forEach((rawLine, rowIdx) => {
    let line = rawLine;
    for (let i = 1; i <= 5; i++) {
      const placeholder = `{INNER_${i}}`;
      if (line.includes(placeholder)) {
        const innerRow = innerRows[i - 1] != null ? innerRows[i - 1] : ' '.repeat(INNER_WIDTH);
        line = line.split(placeholder).join(innerRow);
      }
    }
    line = padCenter(line, BODY_WIDTH);

    if (innerRowIndices.includes(rowIdx) && decoIdx < 5) {
      const leftDeco = (rot(moveDeco.left, decoIdx) || '').padEnd(DECO_WIDTH);
      const rightDeco = (rot(moveDeco.right, decoIdx) || '').padStart(DECO_WIDTH);
      line = leftDeco + line + rightDeco;
      decoIdx++;
    } else {
      line = ' '.repeat(DECO_WIDTH) + line + ' '.repeat(DECO_WIDTH);
    }
    sprite.push(line);
  });

  if (moveDeco.bottom) sprite.push(padCenter(moveDeco.bottom, SPRITE_WIDTH_FINAL));

  const tox = organism.toxicity.name;
  let toxLine = '';
  if (tox === 'lethal') toxLine = '!!!!! LETHAL TOXICITY !!!!!';
  else if (tox === 'highly toxic') toxLine = '!! HIGHLY TOXIC !!';
  else if (tox === 'toxic') toxLine = '! toxic !';
  else if (tox === 'mild irritant') toxLine = '~ irritant ~';
  if (toxLine) sprite.push(padCenter(toxLine, SPRITE_WIDTH_FINAL));

  const namePlate = `[ ${padCenter(organism.name.slice(0, 20), 20)} ]`;
  sprite.push(padCenter(namePlate, SPRITE_WIDTH_FINAL));

  return sprite;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const STAT_DESCRIPTIONS = {
  SPD: 'Turn order & initiative', DEF: 'Reduce incoming damage', ACC: 'Chance to hit enemies',
  EVA: 'Chance to dodge attacks', RGN: 'HP recovered each turn',
};

/* ============ BattleLog — captures a UI-friendly snapshot on every line ============ */
class BattleLog {
  constructor(org1, org2) {
    this.entries = [];
    this.turn = 0;
    this.org1 = org1;
    this.org2 = org2;
  }
  log(message, type, vfx) {
    this.entries.push({
      turn: this.turn, message, type: type || 'info', vfx: vfx || null,
      hp1: this.org1.health, maxHp1: this.org1.maxHealth,
      hp2: this.org2.health, maxHp2: this.org2.maxHealth,
      en1: this.org1.energy, maxEn1: this.org1.maxEnergy,
      en2: this.org2.energy, maxEn2: this.org2.maxEnergy,
    });
  }
  newTurn() {
    this.turn += 1;
    this.log(`Turn ${this.turn}`, 'turn');
  }
}

/* ============ Battle — ported from battle.py ============ */
class Battle {
  constructor(org1, org2, maxTurns) {
    this.org1 = org1;
    this.org2 = org2;
    this.maxTurns = maxTurns || 50;
    this.org1.resetForBattle();
    this.org2.resetForBattle();
    this.log = new BattleLog(org1, org2);
    this.winner = null;
    this.loser = null;
  }

  getTurnOrder() {
    if (this.org1.speed > this.org2.speed) return [this.org1, this.org2];
    if (this.org2.speed > this.org1.speed) return [this.org2, this.org1];
    return Math.random() > 0.5 ? [this.org1, this.org2] : [this.org2, this.org1];
  }

  applyResistance(defender, damage, attackCategory, effectType) {
    const env = defender.environment;
    const resistance = env.resistance;
    const reduction = env.reduction || 0;
    if (!resistance) return damage;
    let shouldReduce = false;
    if (resistance === 'all') shouldReduce = true;
    else if (resistance === 'physical' && attackCategory === 'physical') shouldReduce = true;
    else if (resistance === 'energy' && attackCategory === 'energy') shouldReduce = true;
    else if (resistance === 'acid' && (effectType === 'corrode' || effectType === 'dissolve')) shouldReduce = true;
    else if (resistance === 'drain' && effectType === 'drain') shouldReduce = true;
    else if (resistance === 'stun' && (effectType === 'stun' || effectType === 'paralyze')) shouldReduce = true;
    else if (resistance === 'disintegrate' && effectType === 'disintegrate') shouldReduce = true;
    if (shouldReduce) return Math.max(1, Math.trunc(damage * (1 - reduction)));
    return damage;
  }

  calculateDamage(attacker, defender, isCritical, attack) {
    attack = attack || attacker.attackType;
    let baseDamage = attack.damage || 0;
    if (attack === attacker.attackType) baseDamage += attacker.damageBonus;
    if (isCritical) baseDamage = Math.trunc(baseDamage * 1.75);
    if (attacker.energySource.passive === 'feast' && defender.health < defender.maxHealth * 0.3) {
      baseDamage = Math.trunc(baseDamage * 1.2);
    }
    const defenseReduction = Math.floor(defender.defense / 4);
    let damage = Math.max(1, baseDamage - defenseReduction);
    if (defender.shieldActive) damage = Math.floor(damage / 2);
    damage = this.applyResistance(defender, damage, attack.category || 'physical', attack.effect || null);
    if (defender.energySource.passive === 'heat_shield') damage = Math.trunc(damage * 0.85);
    return damage;
  }

  checkCritical(attacker) {
    const critChance = Battle.BASE_CRIT_CHANCE;
    if (attacker.specialAbility.effect === 'crit' && attacker.canUseSpecial()) {
      if (randInt(1, 100) <= attacker.specialAbility.chance) return true;
    }
    return randInt(1, 100) <= critChance;
  }

  checkSpecialAbility(organism, opponent) {
    if (!organism.canUseSpecial()) return null;
    const ability = organism.specialAbility;
    const roll = randInt(1, 100);
    if (roll <= ability.chance) return this.applySpecialAbility(organism, opponent, ability);
    return null;
  }

  applySpecialAbility(organism, opponent, ability) {
    const effect = ability.effect;
    if (effect === 'blind') { opponent.statusEffects.push({type:'blind', duration:2}); return `${organism.name}'s ${ability.name} blinds ${opponent.name}! (-20 accuracy for 2 turns)`; }
    if (effect === 'clone') { organism.cloneActive = true; const bonus = Math.floor(organism.attackType.damage / 2); return `${organism.name} uses ${ability.name}! Clone deals ${bonus} bonus damage!`; }
    if (effect === 'confuse') { opponent.statusEffects.push({type:'confuse', duration:2}); return `${organism.name}'s ${ability.name} confuses ${opponent.name}! (May attack self)`; }
    if (effect === 'shield') { organism.shieldActive = true; organism.statusEffects.push({type:'shield', duration:2}); return `${organism.name} activates ${ability.name}! Defense boosted!`; }
    if (effect === 'dodge') { return `${organism.name} uses ${ability.name} and phases out! Attack automatically misses!`; }
    if (effect === 'boost') { organism.statusEffects.push({type:'boost', duration:1}); return `${organism.name}'s ${ability.name} channels extra power! +50% damage next attack!`; }
    if (effect === 'lock') { opponent.statusEffects.push({type:'lock', duration:3}); return `${organism.name}'s ${ability.name} anchors ${opponent.name}! Cannot evade!`; }
    if (effect === 'mirror') { organism.statusEffects.push({type:'mirror', duration:1}); return `${organism.name}'s ${ability.name} creates a damage reflection!`; }
    if (effect === 'crit') return 'CRITICAL_HIT';
    if (effect === 'extra_turn') return 'EXTRA_TURN';
    if (effect === 'heal') { const heal = Math.trunc(organism.maxHealth * 0.15); organism.health = Math.min(organism.maxHealth, organism.health + heal); return `${organism.name}'s ${ability.name} heals ${heal} HP!`; }
    if (effect === 'speed_boost') { organism.statusEffects.push({type:'speed_boost', duration:2}); return `${organism.name}'s ${ability.name} increases speed!`; }
    if (effect === 'poison_boost') { organism.statusEffects.push({type:'poison_boost', duration:1}); return `${organism.name}'s ${ability.name} coats next attack in venom!`; }
    return null;
  }

  checkDefensiveMechanism(defender, attacker, damage) {
    const messages = [];
    const mechanism = defender.defenseMechanism;
    if (!mechanism.trigger || !mechanism.effect) return [damage, messages];
    const trigger = mechanism.trigger;
    const effect = mechanism.effect;
    const chance = mechanism.chance || 0;
    const value = mechanism.value || 0;
    if (trigger === 'hit') {
      if (randInt(1, 100) > chance) return [damage, messages];
      if (effect === 'blind') { attacker.statusEffects.push({type:'blind', duration:2}); messages.push(`${defender.name}'s ink cloud blinds ${attacker.name}!`); }
      else if (effect === 'counter') { attacker.health -= value; messages.push(`${defender.name}'s spike reflex deals ${value} counter damage!`); }
      else if (effect === 'redirect') { messages.push(`${defender.name}'s decoy takes the hit!`); return [0, messages]; }
      else if (effect === 'shock') { attacker.health -= value; messages.push(`${defender.name}'s electric discharge shocks for ${value} damage!`); }
    }
    return [damage, messages];
  }

  checkReproductionAbility(organism, opponent) {
    const messages = [];
    const repro = organism.reproduction;
    if (repro.effect == null || organism.reproductionTriggered) return messages;

    const threshold = repro.threshold || 0;
    const hpPercent = organism.health / organism.maxHealth;
    if (hpPercent <= threshold) {
      organism.reproductionTriggered = true;
      const effect = repro.effect;
      const bonus = repro.bonus || 0;
      if (effect === 'split') { const dmg = Math.trunc(organism.attackType.damage * bonus); opponent.health -= dmg; messages.push(`${organism.name} undergoes binary fission! Clone attacks for ${dmg} damage!`); }
      else if (effect === 'spore_burst') { opponent.health -= bonus; messages.push(`${organism.name} releases spore burst dealing ${bonus} damage!`); }
      else if (effect === 'regenerate') { const heal = Math.trunc(organism.maxHealth * bonus); organism.health = Math.min(organism.maxHealth, organism.health + heal); messages.push(`${organism.name}'s budding regenerates ${heal} HP!`); }
      else if (effect === 'fragment') { const frag = bonus * 3; opponent.health -= frag; messages.push(`${organism.name} fragments dealing ${frag} total damage!`); }
      else if (effect === 'dormant') { organism.statusEffects.push({type:'dormant', duration:bonus}); messages.push(`${organism.name} enters dormant endospore state! Immune for ${bonus} turns.`); }
    }

    const defense = organism.defenseMechanism;
    if (defense.effect === 'escape' && !organism.reproductionTriggered) {
      const dThreshold = defense.value != null ? defense.value : 0.25;
      if (hpPercent <= dThreshold) {
        organism.reproductionTriggered = true;
        const heal = 15;
        organism.health = Math.min(organism.maxHealth, organism.health + heal);
        messages.push(`${organism.name} uses autotomy! Sheds damaged parts and heals ${heal} HP!`);
      }
    }
    return messages;
  }

  getStatusModifiers(organism) {
    const mods = {accuracy:0, damage:1.0, canEvade:true, canAct:true};
    for (const effect of organism.statusEffects) {
      if (effect.type === 'blind') mods.accuracy -= 20;
      else if (effect.type === 'boost') mods.damage *= 1.5;
      else if (effect.type === 'lock') mods.canEvade = false;
      else if (effect.type === 'slow') mods.accuracy -= 10;
      else if (effect.type === 'dormant') { mods.canAct = false; mods.canEvade = false; }
    }
    return mods;
  }

  processEndOfTurn(organism, opponent) {
    const effects = [];
    const isDormant = organism.statusEffects.some(e => e.type === 'dormant');

    if (!isDormant && organism.regen > 0 && organism.health < organism.maxHealth) {
      const healed = Math.min(organism.regen, organism.maxHealth - organism.health);
      organism.health += healed;
      effects.push(`${organism.name} regenerates ${healed} HP`);
    }
    if (organism.energySource.passive === 'light_heal') {
      organism.health = Math.min(organism.maxHealth, organism.health + 3);
      effects.push(`${organism.name}'s photosynthesis heals 3 HP`);
    }
    if (!isDormant && organism.energy < organism.maxEnergy) {
      organism.energy = Math.min(organism.maxEnergy, organism.energy + organism.energySource.energy_regen);
    }
    if (!isDormant && organism.toxicity.contact_damage > 0) {
      const tox = organism.toxicity.contact_damage;
      if (opponent.energySource.passive !== 'toxin_immune') {
        opponent.health -= tox;
        effects.push(`${opponent.name} takes ${tox} toxicity damage from ${organism.name}`);
      }
    }
    for (const effect of organism.statusEffects) {
      if (effect.type === 'poison') {
        if (organism.energySource.passive !== 'toxin_immune') { organism.health -= Battle.POISON_DAMAGE; effects.push(`${organism.name} takes ${Battle.POISON_DAMAGE} poison damage`); }
      } else if (effect.type === 'burn') { organism.health -= Battle.BURN_DAMAGE; effects.push(`${organism.name} takes ${Battle.BURN_DAMAGE} burn damage`); }
      else if (effect.type === 'bleed') { organism.health -= Battle.BLEED_DAMAGE; effects.push(`${organism.name} takes ${Battle.BLEED_DAMAGE} bleed damage`); }
      else if (effect.type === 'dissolve') { organism.health -= Battle.DISSOLVE_DAMAGE; effects.push(`${organism.name} takes ${Battle.DISSOLVE_DAMAGE} dissolve damage`); }
      else if (effect.type === 'corrode') { organism.defense = Math.max(0, organism.defense - 2); effects.push(`${organism.name}'s armor corrodes! Defense -2`); }
      else if (effect.type === 'dot') { organism.health -= 4; effects.push(`${organism.name} takes 4 constriction damage`); }
    }
    const newEffects = [];
    for (const effect of organism.statusEffects) {
      effect.duration -= 1;
      if (effect.duration <= 0) {
        if (effect.type === 'shield') organism.shieldActive = false;
        effects.push(`${organism.name}'s ${effect.type} effect wore off`);
      } else newEffects.push(effect);
    }
    organism.statusEffects = newEffects;

    if (organism.stealthTurns > 0) {
      organism.stealthTurns -= 1;
      if (organism.stealthTurns === 0) effects.push(`${organism.name}'s camouflage fades!`);
    }
    if (organism.specialDisabledTurns > 0) organism.specialDisabledTurns -= 1;

    effects.push(...this.checkReproductionAbility(organism, opponent));
    return effects;
  }

  executeAttack(attacker, defender, useSecondary) {
    const results = [];
    const attackerMods = this.getStatusModifiers(attacker);
    if (!attackerMods.canAct) { results.push(`${attacker.name} is dormant and cannot act!`); return results; }
    if (attacker.isStunned) { attacker.isStunned = false; results.push(`${attacker.name} is stunned and cannot act!`); return results; }

    const isConfused = attacker.statusEffects.some(e => e.type === 'confuse');
    if (isConfused && Math.random() < 0.3) {
      const selfDamage = Math.floor(attacker.attackType.damage / 2);
      attacker.health -= selfDamage;
      results.push(`${attacker.name} is confused and hits itself for ${selfDamage} damage!`);
      return results;
    }

    const attack = useSecondary ? attacker.secondaryAttack : attacker.attackType;
    if (useSecondary && (attack.damage || 0) === 0) { results.push(`${attacker.name} has no secondary attack!`); return results; }

    const energyCost = attack.energy_cost || 0;
    if (attacker.energy < energyCost) { results.push(`${attacker.name} doesn't have enough energy! (${attacker.energy}/${energyCost})`); return results; }
    attacker.energy -= energyCost;

    const specialResult = this.checkSpecialAbility(attacker, defender);
    let isCritical = this.checkCritical(attacker);
    let extraTurn = false;
    let autoMiss = false;

    const side = org => org === this.org1 ? 1 : 2;

    if (specialResult) {
      if (specialResult === 'CRITICAL_HIT') { isCritical = true; results.push({__vfx:{kind:'special', side: side(attacker), abilityName: attacker.specialAbility.name}}); results.push(`${attacker.name}'s probability warp triggers a CRITICAL HIT!`); }
      else if (specialResult === 'EXTRA_TURN') { extraTurn = true; results.push({__vfx:{kind:'special', side: side(attacker), abilityName: attacker.specialAbility.name}}); results.push(`${attacker.name}'s temporal stutter grants an EXTRA ACTION!`); }
      else { results.push({__vfx:{kind:'special', side: side(attacker), abilityName: attacker.specialAbility.name}}); results.push(specialResult); if (specialResult.includes('phases out')) autoMiss = true; }
    }
    if (defender.canUseSpecial()) {
      const defenderSpecial = this.checkSpecialAbility(defender, attacker);
      if (defenderSpecial && defenderSpecial.includes('phases out')) { results.push({__vfx:{kind:'special', side: side(defender), abilityName: defender.specialAbility.name}}); results.push(defenderSpecial); autoMiss = true; }
    }

    const defenderMods = this.getStatusModifiers(defender);
    let hit = false;
    if (autoMiss) hit = false;
    else if (defender.statusEffects.some(e => e.type === 'dormant')) { hit = false; results.push(`${defender.name} is dormant and immune to attacks!`); }
    else if (!defenderMods.canEvade) { hit = true; results.push(`${defender.name} cannot evade!`); }
    else {
      const modifiedAccuracy = attacker.accuracy + attackerMods.accuracy;
      const effectiveEvasion = defender.getEffectiveEvasion();
      const hitChance = (modifiedAccuracy * attacker.size.hit_chance_mod) - effectiveEvasion;
      hit = randInt(1, 100) <= hitChance;
      if (defender.stealthTurns > 0 && !hit) results.push(`${defender.name}'s camouflage causes the attack to miss!`);
    }

    results.push({__vfx:{kind:'attack', attackerSide: side(attacker), defenderSide: side(defender), attackName: attack.name, hit}});

    if (hit) {
      let damage = this.calculateDamage(attacker, defender, isCritical, attack);

      if (attacker.cloneActive) { damage += Math.floor(attacker.attackType.damage / 2); attacker.cloneActive = false; }
      if (attacker.statusEffects.some(e => e.type === 'boost')) damage = Math.trunc(damage * 1.5);
      const hasPoisonBoost = attacker.statusEffects.some(e => e.type === 'poison_boost');
      const hasMirror = defender.statusEffects.some(e => e.type === 'mirror');
      if (hasMirror) { const reflected = Math.floor(damage / 2); attacker.health -= reflected; results.push(`${defender.name}'s void echo reflects ${reflected} damage back!`); }

      const [dmgAfterDefense, defenseMsgs] = this.checkDefensiveMechanism(defender, attacker, damage);
      damage = dmgAfterDefense;
      results.push(...defenseMsgs);

      if (damage > 0) {
        if (attacker.energySource.passive === 'nutrient_absorb') { attacker.health = Math.min(attacker.maxHealth, attacker.health + 2); results.push(`${attacker.name} absorbs 2 HP!`); }
        if (defender.energySource.passive === 'attack_drain') defender.energy = Math.min(defender.maxEnergy, defender.energy + 2);

        defender.health -= damage;
        let hitMsg = `${attacker.name} hits ${defender.name} with ${attack.name} for ${damage} damage!`;
        if (isCritical) hitMsg += ' CRITICAL!';
        if (defender.shieldActive) hitMsg += ' (shielded)';
        results.push(hitMsg);

        const attackEffect = attack.effect || null;
        if (attackEffect === 'poison' || hasPoisonBoost) {
          if (defender.energySource.passive !== 'toxin_immune') { defender.statusEffects.push({type:'poison', duration:3}); results.push(`${defender.name} is poisoned!`); }
          else results.push(`${defender.name} is immune to poison!`);
        }
        if (attackEffect === 'drain') {
          if (defender.environment.resistance !== 'drain') { const drained = Math.floor(damage / 2); attacker.health = Math.min(attacker.maxHealth, attacker.health + drained); results.push(`${attacker.name} drains ${drained} HP!`); }
        } else if (attackEffect === 'corrode') { defender.statusEffects.push({type:'corrode', duration:3}); results.push(`${defender.name}'s armor is corroding!`); }
        else if (attackEffect === 'stun') { if (defender.environment.resistance !== 'stun' && Math.random() < 0.35) { defender.isStunned = true; results.push(`${defender.name} is stunned!`); } }
        else if (attackEffect === 'paralyze') { if (defender.environment.resistance !== 'stun' && Math.random() < 0.25) { defender.isStunned = true; results.push(`${defender.name} is paralyzed!`); } }
        else if (attackEffect === 'phase') { const bonusPhase = Math.floor(defender.defense / 4); defender.health -= bonusPhase; results.push(`Quantum damage bypasses ${bonusPhase} armor!`); }
        else if (attackEffect === 'disintegrate') { if (defender.environment.resistance !== 'disintegrate' && Math.random() < 0.1) { const extraDmg = Math.floor(defender.health / 5); defender.health -= extraDmg; results.push(`VOID DISINTEGRATION! ${extraDmg} extra damage!`); } }
        else if (attackEffect === 'burn') { defender.statusEffects.push({type:'burn', duration:2}); results.push(`${defender.name} is burning!`); }
        else if (attackEffect === 'bleed') { defender.statusEffects.push({type:'bleed', duration:3}); results.push(`${defender.name} is bleeding!`); }
        else if (attackEffect === 'dissolve') { defender.statusEffects.push({type:'dissolve', duration:2}); results.push(`${defender.name} is being dissolved!`); }
        else if (attackEffect === 'slow') { defender.statusEffects.push({type:'slow', duration:2}); results.push(`${defender.name} is slowed!`); }
        else if (attackEffect === 'energy_steal') { const stolen = Math.min(5, defender.energy); defender.energy -= stolen; attacker.energy = Math.min(attacker.maxEnergy, attacker.energy + stolen); results.push(`${attacker.name} steals ${stolen} energy!`); }
        else if (attackEffect === 'dot') { defender.statusEffects.push({type:'dot', duration:2}); results.push(`${defender.name} is being constricted!`); }
        else if (attackEffect === 'weaken') { defender.defense = Math.max(0, defender.defense - 3); results.push(`${defender.name}'s defense reduced by 3!`); }
        else if (attackEffect === 'heal') { const heal = Math.floor(damage / 2); attacker.health = Math.min(attacker.maxHealth, attacker.health + heal); results.push(`${attacker.name} leeches ${heal} HP!`); }
        else if (attackEffect === 'disable_special') { defender.specialDisabledTurns = 3; results.push(`${defender.name}'s special ability is disabled for 3 turns!`); }
        else if (attackEffect === 'knockback') { if (Math.random() < 0.3) { defender.isStunned = true; results.push(`${defender.name} is staggered!`); } }
      }
    } else {
      results.push(`${attacker.name}'s ${attack.name} misses ${defender.name}!`);
    }

    if (extraTurn && attacker.isAlive() && defender.isAlive()) {
      results.push(`${attacker.name} takes another action!`);
      results.push(...this.executeAttack(attacker, defender));
    }
    return results;
  }

  simulate() {
    this.log.log(`${this.org1.name} vs ${this.org2.name}`, 'header');
    let [first, second] = this.getTurnOrder();
    this.log.log(`${first.name} moves first (Speed: ${first.speed} vs ${second.speed})`, 'header');

    while (this.log.turn < this.maxTurns) {
      this.log.newTurn();

      if (first.isAlive()) {
        this.log.log(`${first.name}'s turn${this._getStatusString(first)}`, 'turnstart');
        const results = this.executeAttack(first, second, this._shouldUseSecondary(first, second));
        for (const r of results) {
          if (typeof r === 'string') this.log.log(r, 'action');
          else this.log.log('', 'vfx', r.__vfx);
        }
      }
      if (!first.isAlive() && !second.isAlive()) break;
      if (!second.isAlive()) { this.winner = first; this.loser = second; break; }

      if (second.isAlive()) {
        this.log.log(`${second.name}'s turn${this._getStatusString(second)}`, 'turnstart');
        const results = this.executeAttack(second, first, this._shouldUseSecondary(second, first));
        for (const r of results) {
          if (typeof r === 'string') this.log.log(r, 'action');
          else this.log.log('', 'vfx', r.__vfx);
        }
      }
      if (!first.isAlive() && !second.isAlive()) break;
      if (!first.isAlive()) { this.winner = second; this.loser = first; break; }

      const firstEffects = this.processEndOfTurn(first, second);
      const secondEffects = this.processEndOfTurn(second, first);
      for (const e of firstEffects) this.log.log(e, 'effect');
      for (const e of secondEffects) this.log.log(e, 'effect');

      if (!first.isAlive() && !second.isAlive()) break;
      if (!first.isAlive()) { this.winner = second; this.loser = first; break; }
      if (!second.isAlive()) { this.winner = first; this.loser = second; break; }
    }

    if (this.winner) this.log.log(`${this.winner.name} wins! (${this.winner.health}/${this.winner.maxHealth} HP remaining)`, 'victory');
    else this.log.log(`Draw — battle ended after ${this.maxTurns} turns`, 'draw');

    return {winner: this.winner, loser: this.loser, turns: this.log.turn, entries: this.log.entries};
  }

  _getStatusString(organism) {
    const effects = organism.statusEffects.map(e => `${e.type}(${e.duration})`);
    if (organism.stealthTurns > 0) effects.push(`stealth(${organism.stealthTurns})`);
    if (organism.specialDisabledTurns > 0) effects.push(`disabled(${organism.specialDisabledTurns})`);
    return effects.length ? ` [${effects.join(', ')}]` : '';
  }

  _shouldUseSecondary(attacker, defender) {
    const secondary = attacker.secondaryAttack;
    if ((secondary.damage || 0) === 0) return false;
    if (attacker.energy < attacker.attackType.energy_cost && attacker.energy >= secondary.energy_cost) return true;
    if (secondary.effect === 'energy_steal' && attacker.energy < 20) return Math.random() < 0.4;
    if (secondary.effect === 'heal' && attacker.health < attacker.maxHealth * 0.5) return Math.random() < 0.3;
    if (secondary.effect === 'disable_special' && defender.specialDisabledTurns === 0) {
      if (['extra_turn','crit','mirror'].includes(defender.specialAbility.effect)) return Math.random() < 0.4;
    }
    return Math.random() < 0.15;
  }
}
Battle.BASE_CRIT_CHANCE = 5;
Battle.POISON_DAMAGE = 4;
Battle.BURN_DAMAGE = 5;
Battle.BLEED_DAMAGE = 3;
Battle.DISSOLVE_DAMAGE = 3;

/* ============ UI ============ */
let org1, org2;
let animTimer = null;
let pendingEntries = [];
const idleTimers = {1: null, 2: null};
const spriteFrames = {1: 0, 2: 0};

function startIdleAnim(side, speed, cardEl, org) {
  stopIdleAnim(side);
  idleTimers[side] = setInterval(() => {
    const o = org || (side === 1 ? org1 : org2);
    const c = cardEl || document.getElementById('card' + side);
    const spriteEl = c && c.querySelector('.sprite');
    if (!o || !spriteEl) return;
    spriteFrames[side] = (spriteFrames[side] + 1) % 5;
    spriteEl.textContent = generateOrganismSprite(o, spriteFrames[side]).join('\n');
  }, speed);
}
function stopIdleAnim(side) {
  if (idleTimers[side]) { clearInterval(idleTimers[side]); idleTimers[side] = null; }
}
function flashSprite(el, cls) {
  if (!el) return;
  el.classList.remove('lunge-p1', 'lunge-p2', 'flinch');
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 300);
}

function traitRow(label, trait, extra) {
  return `<div class="trait-row" data-tooltip="${escapeHtml(trait.desc || '')}"><span class="trait-label">${label}</span><span class="trait-value">${trait.name}${extra || ''}</span></div>`;
}

function statTile(value, label) {
  return `<div data-tooltip="${escapeHtml(STAT_DESCRIPTIONS[label] || '')}"><b>${value}</b><small>${label}</small></div>`;
}

function renderCard(el, org) {
  el.innerHTML = `
    <div class="cell-name">${org.name}</div>
    <div class="cell-sub">${org.size.name} · ${org.movementType.name}</div>

    <div class="bar-row"><span>HP</span><div class="bar"><div class="bar-fill hp" data-hpfill style="width:100%"></div></div><span class="bar-num" data-hpnum>${org.health}/${org.maxHealth}</span></div>
    <div class="bar-row"><span>EN</span><div class="bar"><div class="bar-fill en" data-enfill style="width:100%"></div></div><span class="bar-num" data-ennum>${org.energy}/${org.maxEnergy}</span></div>
    <div class="stat-grid">
      ${statTile(org.speed, 'SPD')}
      ${statTile(org.defense, 'DEF')}
      ${statTile(org.accuracy, 'ACC')}
      ${statTile(org.evasion, 'EVA')}
      ${statTile(org.regen, 'RGN')}
    </div>
    <div class="traits">
      ${traitRow('Attack', org.attackType, ` (${org.attackType.damage} dmg)`)}
      ${traitRow('Secondary', org.secondaryAttack)}
      ${traitRow('Armor', org.armorType)}
      ${traitRow('Energy', org.energySource)}
      ${traitRow('Sensing', org.sensingType)}
      ${traitRow('Special', org.specialAbility)}
      ${traitRow('Toxicity', org.toxicity)}
      ${traitRow('Reproduction', org.reproduction)}
      ${traitRow('Adaptation', org.environment)}

function newCells() {
  clearAnimation();
  org1 = new Organism();
  org2 = new Organism();
  renderCard(document.getElementById('card1'), org1);
  renderCard(document.getElementById('card2'), org2);
  document.getElementById('log').classList.remove('show');

  document.getElementById('banner').classList.remove('show');

function clearAnimation() {
  if (animTimer) { clearTimeout(animTimer); animTimer = null; }
  pendingEntries = [];
}

function updateBars(entry, c1, c2) {
  c1 = c1 || document.getElementById('card1');
  c2 = c2 || document.getElementById('card2');
  const hp1 = Math.max(0, entry.hp1), hp2 = Math.max(0, entry.hp2);
  c1.querySelector('[data-hpfill]').style.width = Math.max(0, (hp1 / entry.maxHp1) * 100) + '%';
  c1.querySelector('[data-hpnum]').textContent = `${hp1}/${entry.maxHp1}`;
  c1.querySelector('[data-enfill]').style.width = Math.max(0, (entry.en1 / entry.maxEn1) * 100) + '%';
  c1.querySelector('[data-ennum]').textContent = `${entry.en1}/${entry.maxEn1}`;
  c2.querySelector('[data-hpfill]').style.width = Math.max(0, (hp2 / entry.maxHp2) * 100) + '%';
  c2.querySelector('[data-hpnum]').textContent = `${hp2}/${entry.maxHp2}`;
  c2.querySelector('[data-enfill]').style.width = Math.max(0, (entry.en2 / entry.maxEn2) * 100) + '%';
  c2.querySelector('[data-ennum]').textContent = `${entry.en2}/${entry.maxEn2}`;
}

function appendLine(entry, log) {
  log = log || document.getElementById('log');
  const line = document.createElement('div');
  line.className = 'log-line ' + entry.type;
  line.textContent = entry.message;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function delayForType(type) {
  if (type === 'turn') return 260;
  if (type === 'header') return 200;
  if (type === 'vfx') return 420;
  if (type === 'victory' || type === 'draw') return 0;
  return 85;
}

function flashCard(card, cls) {
  card.classList.remove('hit-flash', 'miss-flash', 'special-flash');
  void card.offsetWidth;
  card.classList.add(cls);
  setTimeout(() => card.classList.remove(cls), 380);
}

function triggerVfx(vfx, card1, card2, stage) {
  stage = stage || document.getElementById('stage');
  card1 = card1 || document.getElementById('card1');
  card2 = card2 || document.getElementById('card2');

  if (vfx.kind === 'attack') {
    const chars = ATTACK_EFFECTS[vfx.attackName] || ['*', 'o', '*', 'o'];
    const ch = choice(chars);
    const attackerCard = vfx.attackerSide === 1 ? card1 : card2;
    const defenderCard = vfx.defenderSide === 1 ? card1 : card2;
    flashSprite(attackerCard.querySelector('.sprite'), vfx.attackerSide === 1 ? 'lunge-p1' : 'lunge-p2');
    if (vfx.hit) flashSprite(defenderCard.querySelector('.sprite'), 'flinch');
    let frame = 0;
    const frames = 3;
    (function step() {
      if (frame < frames) {
        stage.textContent = `${ch} ${'-'.repeat(frame * 3)}`;
        stage.style.color = vfx.hit ? 'var(--danger)' : 'var(--muted)';
        frame++;
        setTimeout(step, 100);
      } else {
        stage.textContent = vfx.hit ? '* HIT *' : '... miss ...';
        stage.style.color = vfx.hit ? 'var(--danger)' : 'var(--muted)';
        flashCard(defenderCard, vfx.hit ? 'hit-flash' : 'miss-flash');
      }
    })();
  } else if (vfx.kind === 'special') {
    const card = vfx.side === 1 ? card1 : card2;
    stage.textContent = `★ ${vfx.abilityName.toUpperCase()} ★`;
    stage.style.color = 'var(--special)';
    flashCard(card, 'special-flash');
  }
}

function playNext(onDone, ctx) {
  if (!pendingEntries.length) { onDone(); return; }
  const entry = pendingEntries.shift();
  const c1 = ctx && ctx.card1, c2 = ctx && ctx.card2, stage = ctx && ctx.stage, log = ctx && ctx.log;
  updateBars(entry, c1, c2);
  if (entry.type === 'vfx') triggerVfx(entry.vfx, c1, c2, stage);
  else appendLine(entry, log);
  animTimer = setTimeout(() => playNext(onDone, ctx), delayForType(entry.type));
}

function flushRemaining(ctx, onDone) {
  if (animTimer) { clearTimeout(animTimer); animTimer = null; }
  const c1 = ctx && ctx.card1, c2 = ctx && ctx.card2, log = ctx && ctx.log;
  while (pendingEntries.length) {
    const entry = pendingEntries.shift();
    updateBars(entry, c1, c2);
    if (entry.type !== 'vfx') appendLine(entry, log);
  }
  onDone();
}

let currentCtx = null;
let currentOnDone = null;

function beginAnimation(entries, ctx, onDone) {
  pendingEntries = entries.slice();
  currentCtx = ctx;
  currentOnDone = onDone;
  playNext(onDone, ctx);
}

function handleLogSkip() {
  if (pendingEntries.length) flushRemaining(currentCtx, currentOnDone);
}

let currentResult = null;

function showWinOverlay(overlayEl, line1El, line2El, winner, loser, isDraw, winnerSide) {
  if (!overlayEl || !line1El || !line2El) return;
  if (isDraw) {
    line1El.textContent = 'DRAW';
    line1El.style.color = 'var(--muted)';
    line2El.textContent = '';
  } else {
    line1El.textContent = `${winner.name} WINS`;
    line1El.style.color = winnerSide === 1 ? 'var(--p1)' : 'var(--p2)';
    line2El.textContent = `${loser.name} LOSES`;
  }
  overlayEl.classList.remove('show');
  void overlayEl.offsetWidth;
  overlayEl.classList.add('show');
  const dismiss = () => overlayEl.classList.remove('show');
  overlayEl.onclick = dismiss;
  clearTimeout(overlayEl._dismissTimer);
  overlayEl._dismissTimer = setTimeout(dismiss, 2600);
}

function finishBattle() {
  startIdleAnim(1, 550);
  startIdleAnim(2, 550);
  const stage = document.getElementById('stage');
  stage.textContent = 'VS';
  stage.style.color = '';
  const banner = document.getElementById('banner');
  const winOverlay = document.getElementById('winOverlay');
  const winLine1 = document.getElementById('winLine1');
  const winLine2 = document.getElementById('winLine2');
  if (currentResult.winner) {
    const isP1 = currentResult.winner === org1;
    banner.style.color = isP1 ? 'var(--p1)' : 'var(--p2)';
    banner.textContent = `${currentResult.winner.name} wins in ${currentResult.turns} turns`;
    showWinOverlay(winOverlay, winLine1, winLine2, currentResult.winner, currentResult.loser, false, isP1 ? 1 : 2);
  } else {
    banner.style.color = 'var(--accent)';
    banner.textContent = `Draw after ${currentResult.turns} turns`;
    showWinOverlay(winOverlay, winLine1, winLine2, null, null, true);
  }
  banner.classList.add('show');
  document.getElementById('skipHint').style.display = 'none';
  document.getElementById('battleBtn').disabled = false;
  document.getElementById('battleBtn').textContent = 'Rematch';
}

function runBattle() {
  document.getElementById('battleBtn').disabled = true;
  document.getElementById('banner').classList.remove('show');
  const log = document.getElementById('log');
  log.innerHTML = '';
  log.classList.add('show');
  document.getElementById('skipHint').style.display = 'block';
  startIdleAnim(1, 220);
  startIdleAnim(2, 220);

  const battle = new Battle(org1, org2, 50);
  currentResult = battle.simulate();
  beginAnimation(currentResult.entries, null, finishBattle);
}

document.getElementById('newBtn').addEventListener('click', newCells);
document.getElementById('battleBtn').addEventListener('click', runBattle);

/* ============ Roster persistence ============ */
const ROSTER_KEY = 'scb_roster_v1';

function loadRoster() {
  try {
    const raw = localStorage.getItem(ROSTER_KEY);
    if (!raw) return [];
    return JSON.parse(raw).map(Organism.fromDict);
  } catch (e) {
    return [];
  }
}
function saveRoster() {
  localStorage.setItem(ROSTER_KEY, JSON.stringify(roster.map(o => o.toDict())));
}

let roster = loadRoster();
if (roster.length === 0) {
  for (let i = 0; i < 5; i++) roster.push(new Organism());

}

/* ============ My Cells (roster + leaderboard) ============ */
let releaseConfirmId = null;

function renderRosterList() {
  const list = document.getElementById('rosterList');
  document.getElementById('cellsCount').textContent = `(${roster.length})`;
  if (roster.length === 0) {
    list.innerHTML = '<div class="roster-empty">No cells yet — roll a new one to get started.</div>';

  }

    <div class="roster-row">
      <div class="roster-rank">#${i + 1}</div>

      </div>
      <div class="roster-stats">
        <span><b>${org.wins}</b>-${org.losses}</span>
        <span>Evo <b>${org.getEvoLevel()}</b></span>
        <span>Score <b>${org.getScore()}</b></span>

document.getElementById('rollNewCellBtn').addEventListener('click', () => {

/* ============ Tab switching ============ */
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  stopIdleAnim(1);
  stopIdleAnim(2);
  if (tab === 'quick') { startIdleAnim(1, 550); startIdleAnim(2, 550); }
  else if (tab === 'cells') renderRosterList();
  else if (tab === 'team') renderTeamPicker();
}
document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

/* ============ Team Battle: pick a roster, fight the computer's team ============ */
let selectedTeamIds = [];

function renderTeamPicker() {
  selectedTeamIds = selectedTeamIds.filter(id => roster.some(o => o.id === id));
  const stage = document.getElementById('teamStage');
  if (roster.length === 0) {
    stage.innerHTML = '<div class="roster-empty">No cells to battle with — roll some in My Cells first.</div>';
    return;
  }
  const sorted = roster.slice().sort((a, b) => b.getScore() - a.getScore());
  stage.innerHTML = `
    <div class="team-counter"><b>${selectedTeamIds.length}</b>/3 selected — pick up to 3 cells for your team</div>
    <div class="pick-grid">
      ${sorted.map(org => `
        <button class="pick-card ${selectedTeamIds.includes(org.id) ? 'selected' : ''}" data-pick="${org.id}">
          <div class="pick-card-name">${org.name}</div>
          <div class="pick-card-sub">${org.size.name} · ${org.movementType.name}</div>
          <div class="pick-card-score">W${org.wins}-L${org.losses} · Score ${org.getScore()}</div>
        </button>
      `).join('')}
    </div>
    <button class="btn-battle" id="startTeamBtn" ${selectedTeamIds.length === 0 ? 'disabled' : ''}>Fight!</button>
  `;
  stage.querySelectorAll('[data-pick]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.pick;
      if (selectedTeamIds.includes(id)) selectedTeamIds = selectedTeamIds.filter(x => x !== id);
      else if (selectedTeamIds.length < 3) selectedTeamIds.push(id);
      renderTeamPicker();
    });
  });
  const startBtn = document.getElementById('startTeamBtn');
  if (startBtn) startBtn.addEventListener('click', startTeamBattle);
}

function buildMatchArena(matchIndex, total) {
  const stage = document.getElementById('teamStage');
  stage.innerHTML = `
    <div class="match-banner">Match ${matchIndex + 1} of ${total}</div>
    <div class="battle-layout">
      <div class="arena-wrap">
        <div class="arena">
          <div class="card p1" id="tCard1"></div>
          <div class="vs"><div class="stage" id="tStage">VS</div></div>
          <div class="card p2" id="tCard2"></div>
        </div>
        <div class="win-overlay" id="tWinOverlay">
          <div class="win-line win" id="tWinLine1"></div>
          <div class="win-line lose" id="tWinLine2"></div>
        </div>
      </div>
      <div class="side-log">
        <div class="log-panel show" id="tLog"></div>
        <div class="skip-hint">tap the log to skip ahead</div>
      </div>
    </div>
  `;
  document.getElementById('tLog').addEventListener('click', handleLogSkip);
  return {
    card1: document.getElementById('tCard1'),
    card2: document.getElementById('tCard2'),

    winLine1: document.getElementById('tWinLine1'),
    winLine2: document.getElementById('tWinLine2'),
  };
}

function startTeamBattle() {
  const playerTeam = selectedTeamIds.map(id => roster.find(o => o.id === id)).filter(Boolean);
  if (playerTeam.length === 0) return;
  const enemyTeam = playerTeam.map(() => new Organism());
  runTeamMatch(playerTeam, enemyTeam, 0, { playerWins: 0, enemyWins: 0 });
}

function runTeamMatch(playerTeam, enemyTeam, index, tally) {
  if (index >= playerTeam.length) { finishTeamBattle(tally); return; }

  const pOrg = playerTeam[index];
  const eOrg = enemyTeam[index];
  const ctx = buildMatchArena(index, playerTeam.length);
  renderCard(ctx.card1, pOrg);
  renderCard(ctx.card2, eOrg);
  startIdleAnim(1, 220, ctx.card1, pOrg);
  startIdleAnim(2, 220, ctx.card2, eOrg);

  const battle = new Battle(pOrg, eOrg, 50);
  const result = battle.simulate();

  beginAnimation(result.entries, ctx, () => {
    const teamStageEl = document.getElementById('teamStage');
    const isDraw = !result.winner;
    const playerWon = !isDraw && result.winner === pOrg;
    if (!isDraw) pOrg.recordBattle(playerWon);
    if (playerWon) tally.playerWins++;
    else if (!isDraw) tally.enemyWins++;
    saveRoster();

    const winnerSide = isDraw ? null : (result.winner === pOrg ? 1 : 2);
    showWinOverlay(ctx.winOverlay, ctx.winLine1, ctx.winLine2, result.winner, result.loser, isDraw, winnerSide);

    const resultBanner = document.createElement('div');
    resultBanner.className = 'match-banner';
    resultBanner.style.color = isDraw ? 'var(--muted)' : (playerWon ? 'var(--good)' : 'var(--danger)');
    resultBanner.textContent = isDraw ? 'Draw!' : `${result.winner.name} wins this match!`;
    teamStageEl.appendChild(resultBanner);

    setTimeout(() => {
      if (playerWon) {
        showUpgradePicker(pOrg, () => {
          saveRoster();
          runTeamMatch(playerTeam, enemyTeam, index + 1, tally);
        });
      } else if (!isDraw && pOrg.losses >= 3) {
        roster = roster.filter(o => o.id !== pOrg.id);
        saveRoster();
        const notice = document.createElement('div');
        notice.className = 'match-banner';
        notice.style.color = 'var(--danger)';
        notice.textContent = `${pOrg.name} has died after 3 losses.`;
        teamStageEl.appendChild(notice);
        setTimeout(() => runTeamMatch(playerTeam, enemyTeam, index + 1, tally), 1600);
      } else {
        runTeamMatch(playerTeam, enemyTeam, index + 1, tally);
      }
    }, 1400);
  });
}

function showUpgradePicker(org, onDone) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">${org.name} leveled up!</div>
      <div class="modal-sub">Pick a stat to permanently improve</div>
      <div class="upgrade-grid">
        ${Object.entries(UPGRADE_BONUSES).map(([stat, bonus]) => `
          <button class="upgrade-btn" data-stat="${stat}">
            <b>${stat.charAt(0).toUpperCase()}${stat.slice(1)}</b>
            <small>+${bonus}</small>
          </button>
        `).join('')}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-stat]').forEach(btn => {
    btn.addEventListener('click', () => {
      org.evolveStat(btn.dataset.stat);
      overlay.remove();
      onDone();
    });
  });
}

function finishTeamBattle(tally) {
  stopIdleAnim(1);
  stopIdleAnim(2);
  const stage = document.getElementById('teamStage');
  const playerWonOverall = tally.playerWins > tally.enemyWins;
  const tied = tally.playerWins === tally.enemyWins;
  const banner = document.createElement('div');
  banner.className = 'match-banner';
  banner.style.color = tied ? 'var(--muted)' : (playerWonOverall ? 'var(--good)' : 'var(--danger)');
  banner.style.fontSize = '16px';
  banner.textContent = tied
    ? `Match tied ${tally.playerWins}-${tally.enemyWins}`
    : playerWonOverall
      ? `You won the match ${tally.playerWins}-${tally.enemyWins}!`
      : `You lost the match ${tally.enemyWins}-${tally.playerWins}`;
  stage.innerHTML = '';
  stage.appendChild(banner);
  const again = document.createElement('button');
  again.className = 'btn-battle';
  again.style.marginTop = '14px';
  again.textContent = 'Back to Team Select';
  again.addEventListener('click', renderTeamPicker);
  stage.appendChild(again);
}

/* ============ Big twitchy title ============ */
(function twitchTitle() {
  const h1 = document.querySelector('header h1');
  if (!h1) return;
  function tick() {
    if (Math.random() < 0.55) {
      const dx = (Math.random() * 8 - 4).toFixed(1);
      const dy = (Math.random() * 5 - 2.5).toFixed(1);
      const skew = (Math.random() * 4 - 2).toFixed(1);
      h1.style.transform = `translate(${dx}px, ${dy}px) skewX(${skew}deg)`;
      h1.classList.add('glitching');
      setTimeout(() => {
        h1.style.transform = 'translate(0,0)';
        h1.classList.remove('glitching');
      }, 70 + Math.random() * 90);
    }
    setTimeout(tick, 500 + Math.random() * 1500);
  }
  tick();
})();

newCells();
</script>
</body>
</html>
